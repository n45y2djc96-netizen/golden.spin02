<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080300">
  <title>Golden Spin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="brand-diamond">◆</div>
      <div>
        <div class="brand-name">GOLDEN SPIN</div>
        <div class="brand-sub">GOLDEN CASINO</div>
      </div>
    </div>

    <div class="header-right">
      <div class="balance">
        <span class="coin">●</span>
        <span id="balance">12 550</span>
      </div>
      <button class="vip-btn">VIP</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="hero-small">WELCOME, GOLDEN PLAYER</div>

    <h1>
      PLAY TO
      <span>WIN</span>
    </h1>

    <p>
      Испытай удачу в мире<br>
      <b>Golden Spin</b>
    </p>

    <button class="main-spin" onclick="spin()">
      <span>◆</span>
      ИГРАТЬ / SPIN
    </button>

  </section>

  <!-- FEATURES -->
  <section class="features">

    <div class="feature">
      <div class="feature-icon">⚡</div>
      <b>24/7</b>
      <span>ИГРА</span>
    </div>

    <div class="feature">
      <div class="feature-icon">♛</div>
      <b>VIP</b>
      <span>LEVEL</span>
    </div>

    <div class="feature">
      <div class="feature-icon">★</div>
      <b>FREE</b>
      <span>BONUS</span>
    </div>

  </section>

  <!-- GAMES -->
  <section class="games">

    <div class="section-title">
      <span>CHOOSE YOUR GAME</span>
      <h2>Игры</h2>
    </div>

    <div class="game-grid">

      <button class="game-card active" onclick="selectGame('slots')">
        <div class="game-icon">🎰</div>
        <div class="game-name">Слоты</div>
        <div class="game-description">Lucky 777</div>
        <div class="play-arrow">→</div>
      </button>

      <button class="game-card" onclick="selectGame('roulette')">
        <div class="game-icon">🎯</div>
        <div class="game-name">Рулетка</div>
        <div class="game-description">Roulette</div>
        <div class="play-arrow">→</div>
      </button>

      <button class="game-card" onclick="selectGame('wheel')">
        <div class="game-icon">🎡</div>
        <div class="game-name">Колесо</div>
        <div class="game-description">Lucky Wheel</div>
        <div class="play-arrow">→</div>
      </button>

      <button class="game-card" onclick="selectGame('chest')">
        <div class="game-icon">🧰</div>
        <div class="game-name">Сундуки</div>
        <div class="game-description">Golden Chest</div>
        <div class="play-arrow">→</div>
      </button>

      <button class="game-card" onclick="selectGame('block')">
        <div class="game-icon">🔨</div>
        <div class="game-name">Разбить</div>
        <div class="game-description">Break Block</div>
        <div class="play-arrow">→</div>
      </button>

    </div>

  </section>

  <!-- SLOT MACHINE -->
  <section class="casino">

    <div class="casino-header">
      <div class="casino-title">
        <span>🎰</span>
        СЛОТЫ
      </div>

      <div class="jackpot">
        JACKPOT
        <strong id="jackpot">125 500</strong>
      </div>
    </div>

    <div class="machine">

      <div class="machine-top">
        <span>GOLDEN 777</span>
        <span>★ ★ ★</span>
      </div>

      <div class="reels">

        <div class="reel" id="reel1">
          <span>🍋</span>
        </div>

        <div class="reel" id="reel2">
          <span>7️⃣</span>
        </div>

        <div class="reel" id="reel3">
          <span>⭐</span>
        </div>

      </div>

      <div class="win-line"></div>

      <div class="machine-controls">

        <div class="bet">
          <span>СТАВКА</span>

          <div class="bet-control">
            <button onclick="changeBet(-10)">−</button>
            <strong id="bet">50</strong>
            <button onclick="changeBet(10)">+</button>
          </div>
        </div>

        <button class="spin-button" onclick="spin()">
          <span>SPIN</span>
          <small>КРУТИТЬ</small>
        </button>

      </div>

      <div class="result" id="result">
        ГОТОВ К ИГРЕ
      </div>

    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">◆ GOLDEN SPIN</div>
    <div class="footer-text">
      Только виртуальные токены
    </div>
  </footer>

</div>

<!-- WIN POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <div class="popup-star">★</div>
    <h2>ПОБЕДА!</h2>
    <div class="popup-win" id="popupWin">+500</div>
    <button onclick="closePopup()">ЗАБРАТЬ</button>
  </div>
</div>

<script>

let balance = 12550;
let bet = 50;
let spinning = false;

const symbols = [
  "🍋",
  "🍊",
  "🍒",
  "💎",
  "⭐",
  "7️⃣"
];

function formatNumber(number) {
  return number.toLocaleString("ru-RU").replace(/\u00A0/g, " ");
}

function updateBalance() {
  document.getElementById("balance").textContent =
    formatNumber(balance);
}

function changeBet(value) {

  bet += value;

  if (bet < 10) bet = 10;
  if (bet > 500) bet = 500;

  document.getElementById("bet").textContent = bet;
}

function randomSymbol() {
  return symbols[Math.floor(Math.random() * symbols.length)];
}

function spin() {

  if (spinning) return;

  if (balance < bet) {
    document.getElementById("result").textContent =
      "НЕДОСТАТОЧНО ТОКЕНОВ";
    return;
  }

  spinning = true;

  balance -= bet;
  updateBalance();

  const reels = [
    document.querySelector("#reel1 span"),
    document.querySelector("#reel2 span"),
    document.querySelector("#reel3 span")
  ];

  document.getElementById("result").textContent =
    "КРУТИМ...";

  reels.forEach((reel, index) => {

    reel.parentElement.classList.add("spinning");

    let counter = 0;

    const timer = setInterval(() => {

      reel.textContent = randomSymbol();

      counter++;

      if (counter >= 12 + index * 5) {

        clearInterval(timer);

        reel.parentElement.classList.remove("spinning");

        if (index === 2) {
          finishSpin(reels);
        }
      }

    }, 70);

  });
}

function finishSpin(reels) {

  const result = reels.map(r => r.textContent);

  let win = 0;

  if (
    result[0] === result[1] &&
    result[1] === result[2]
  ) {

    win = bet * 10;

  } else if (
    result[0] === result[1] ||
    result[1] === result[2] ||
    result[0] === result[2]
  ) {

    win = bet * 2;

  }

  if (win > 0) {

    balance += win;
    updateBalance();

    document.getElementById("result").textContent =
      "WIN +" + formatNumber(win);

    document.getElementById("popupWin").textContent =
      "+" + formatNumber(win);

    setTimeout(() => {
      document.getElementById("popup").classList.add("show");
    }, 300);

  } else {

    document.getElementById("result").textContent =
      "ПОПРОБУЙ ЕЩЁ";

  }

  spinning = false;
}

function closePopup() {
  document.getElementById("popup").classList.remove("show");
}

function selectGame(game) {

  document.querySelectorAll(".game-card")
    .forEach(card => card.classList.remove("active"));

  event.currentTarget.classList.add("active");

  if (game !== "slots") {

    document.getElementById("result").textContent =
      "РАЗДЕЛ В РАЗРАБОТКЕ";

  } else {

    document.getElementById("result").textContent =
      "ГОТОВ К ИГРЕ";

  }

}

</script>

</body>
</html>

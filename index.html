<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Golden Spin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="logo">
      <span class="diamond">◆</span>
      GOLDEN SPIN
    </div>

    <div class="balance">
      🪙 <span id="balance">12550</span>
    </div>

    <button class="vip">VIP</button>
  </header>

  <main>

    <section class="hero">
      <div class="hero-glow"></div>

      <div class="welcome">WELCOME GOLDEN PLAYER</div>

      <button class="main-spin" onclick="playCurrentGame()">
        ИГРАТЬ / SPIN
      </button>

      <div class="games">

        <button class="game-tab active" onclick="selectGame('slots')">
          <span>🎰</span>
          <small>Слоты</small>
        </button>

        <button class="game-tab" onclick="selectGame('roulette')">
          <span>🎲</span>
          <small>Рулетка</small>
        </button>

        <button class="game-tab" onclick="selectGame('wheel')">
          <span>🎡</span>
          <small>Колесо</small>
        </button>

        <button class="game-tab" onclick="selectGame('chests')">
          <span>🧰</span>
          <small>Сундуки</small>
        </button>

        <button class="game-tab" onclick="selectGame('block')">
          <span>🔨</span>
          <small>Блок</small>
        </button>

      </div>
    </section>

    <section class="casino">

      <div class="game-title">
        <span id="gameIcon">🎰</span>
        <span id="gameTitle">СЛОТЫ</span>
      </div>

      <!-- SLOTS -->
      <div id="slotsGame" class="game-panel">

        <div class="machine">

          <div class="reel" id="reel1">🍋</div>
          <div class="reel" id="reel2">7️⃣</div>
          <div class="reel" id="reel3">⭐</div>

        </div>

        <div class="controls">
          <select id="slotBet">
            <option value="10">Ставка 10</option>
            <option value="25">Ставка 25</option>
            <option value="50" selected>Ставка 50</option>
            <option value="100">Ставка 100</option>
            <option value="250">Ставка 250</option>
          </select>

          <button class="gold-button" onclick="spinSlots()">
            SPIN
          </button>
        </div>

        <div id="slotMessage" class="message">
          Испытай удачу
        </div>

      </div>

      <!-- ROULETTE -->
      <div id="rouletteGame" class="game-panel hidden">

        <div class="roulette-wrap">

          <div class="roulette-pointer">▼</div>

          <div id="rouletteWheel" class="roulette-wheel">
            <div class="roulette-number n0">0</div>
            <div class="roulette-number n1">1</div>
            <div class="roulette-number n2">2</div>
            <div class="roulette-number n3">3</div>
            <div class="roulette-number n4">4</div>
            <div class="roulette-number n5">5</div>
            <div class="roulette-number n6">6</div>
            <div class="roulette-number n7">7</div>
            <div class="roulette-number n8">8</div>
            <div class="roulette-number n9">9</div>
            <div class="roulette-number n10">10</div>
            <div class="roulette-number n11">11</div>
          </div>

        </div>

        <div class="bet-buttons">
          <button onclick="rouletteBet('red')">🔴 КРАСНОЕ</button>
          <button onclick="rouletteBet('black')">⚫ ЧЁРНОЕ</button>
          <button onclick="rouletteBet('green')">🟢 ZERO</button>
        </div>

        <div class="controls">
          <select id="rouletteBet">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="250">250</option>
          </select>

          <button class="gold-button" onclick="spinRoulette()">
            SPIN
          </button>
        </div>

        <div id="rouletteMessage" class="message">
          Сделай ставку
        </div>

      </div>

      <!-- WHEEL -->
      <div id="wheelGame" class="game-panel hidden">

        <div class="wheel-wrap">
          <div class="wheel-pointer">▼</div>
          <div id="fortuneWheel" class="fortune-wheel">
            <div>10</div>
            <div>25</div>
            <div>50</div>
            <div>100</div>
            <div>250</div>
            <div>500</div>
            <div>1000</div>
            <div>💥</div>
          </div>
        </div>

        <button class="gold-button wide" onclick="spinFortuneWheel()">
          КРУТИТЬ КОЛЕСО
        </button>

        <div id="wheelMessage" class="message">
          Попробуй сорвать джекпот
        </div>

      </div>

      <!-- CHESTS -->
      <div id="chestsGame" class="game-panel hidden">

        <div class="chests">

          <button class="chest" onclick="openChest(this)">
            🧰
            <span>Сундук</span>
          </button>

          <button class="chest" onclick="openChest(this)">
            🧰
            <span>Сундук</span>
          </button>

          <button class="chest" onclick="openChest(this)">
            🧰
            <span>Сундук</span>
          </button>

        </div>

        <div id="chestMessage" class="message">
          Выбери один сундук
        </div>

      </div>

      <!-- BLOCK -->
      <div id="blockGame" class="game-panel hidden">

        <div class="block-area">

          <div id="bigBlock" class="big-block">
            🧱
          </div>

          <div class="hits">
            УДАРОВ:
            <span id="hits">0</span>
          </div>

        </div>

        <button class="gold-button wide" onclick="hitBlock()">
          🔨 РАЗБИТЬ
        </button>

        <div id="blockMessage" class="message">
          Разбей блок и получи награду
        </div>

      </div>

    </section>

  </main>

  <div id="toast" class="toast"></div>

</div>

<script src="app.js"></script>

</body>
</html>

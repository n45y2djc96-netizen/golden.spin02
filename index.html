<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#170804">

  <title>Golden Spin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    ◆ GOLDEN SPIN
  </div>

  <div class="wallet">
    🪙
    <b id="balance">12 550</b>

    <button class="vip-btn" id="vipBtn">
      VIP
    </button>
  </div>

</header>


<section class="hero">

  <button class="hero-spin" id="heroSpin">
    ИГРАТЬ / SPIN
  </button>

</section>


<nav class="game-nav">

  <button class="game-tab active" data-game="slots">
    🎰
    <small>Слоты</small>
  </button>

  <button class="game-tab" data-game="roulette">
    🎲
    <small>Рулетка</small>
  </button>

  <button class="game-tab" data-game="wheel">
    🎡
    <small>Мини-игры</small>
  </button>

  <button class="game-tab" data-game="chests">
    🧰
    <small>Сундуки</small>
  </button>

  <button class="game-tab" data-game="smash">
    🔨
    <small>Разбить</small>
  </button>

</nav>


<main id="game"></main>


<section class="info-grid">

  <div class="panel">

    <h3>🏆 ЛИДЕРБОРД</h3>

    <div>
      🥇 Player_777
      <b>128 450</b>
    </div>

    <div>
      🥈 LuckyFox
      <b>96 200</b>
    </div>

    <div>
      🥉 GoldenBoy
      <b>74 800</b>
    </div>

  </div>


  <div class="panel daily">

    <h3>🎁 ЕЖЕДНЕВНЫЙ БОНУС</h3>

    <p>
      Бесплатные <b>250</b> токенов
    </p>

    <button class="gold-btn" id="dailyBtn">
      ЗАБРАТЬ
    </button>

  </div>

</section>


<button class="sound-toggle" id="soundToggle">
  🔊
</button>


<div class="toast" id="toast"></div>


<div class="modal" id="modal">

  <div class="modal-card">

    <button class="modal-close" id="modalClose">
      ×
    </button>

    <h2 id="modalTitle">
      VIP
    </h2>

    <p id="modalText"></p>

    <button class="gold-btn" id="modalOk">
      ПОНЯТНО
    </button>

  </div>

</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="app.js"></script>

</body>
</html>

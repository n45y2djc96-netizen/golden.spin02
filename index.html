<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#090604">

  <title>Golden Spin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg-stars"></div>
<div class="bg-glow"></div>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <button class="header-icon" id="profileBtn">◆</button>

    <div class="logo">
      <span>GOLDEN</span>
      <b>SPIN</b>
    </div>

    <div class="header-actions">

      <div class="balance-box">
        <span class="coin">●</span>
        <strong id="balance">12 500</strong>
      </div>

      <button class="vip-btn" id="vipBtn">
        КУПИТЬ VIP
      </button>

    </div>

  </header>


  <!-- HERO -->

  <section class="hero">

    <div class="hero-light"></div>

    <div class="hero-title">
      ИГРАТЬ / <span>SPIN</span>
    </div>

    <button class="main-spin" id="mainSpin">
      <span>✦</span>
      ИГРАТЬ / SPIN
      <span>✦</span>
    </button>

    <div class="hero-line"></div>

  </section>


  <!-- GAME NAVIGATION -->

  <section class="game-nav">

    <button class="nav-arrow" id="navLeft">‹</button>

    <button class="game-nav-card active" data-game="slots">
      <div class="nav-art slots-art">
        <span>7</span>
        <b>7</b>
        <span>7</span>
      </div>
      <strong>Слоты</strong>
    </button>

    <button class="game-nav-card" data-game="roulette">
      <div class="nav-art roulette-art">
        <div class="roulette-mini"></div>
      </div>
      <strong>Рулетка</strong>
    </button>

    <button class="game-nav-card" data-game="wheel">
      <div class="nav-art wheel-art">
        <div class="wheel-mini"></div>
      </div>
      <strong>Колесо</strong>
    </button>

    <button class="game-nav-card" data-game="chests">
      <div class="nav-art chest-art">
        <span>♜</span>
        <span>♜</span>
        <span>♜</span>
      </div>
      <strong>Мини-игры</strong>
    </button>

    <button class="game-nav-card" data-game="smash">
      <div class="nav-art smash-art">
        🔨
      </div>
      <strong>Разбить</strong>
    </button>

    <button class="nav-arrow" id="navRight">›</button>

  </section>


  <!-- GAME AREA -->

  <main id="gameArea"></main>


  <!-- LOWER PANELS -->

  <section class="lower-grid">

    <!-- TOURNAMENT -->

    <div class="gold-panel tournament">

      <div class="panel-title">
        <span>✦</span>
        ТУРНИР ЛИДЕРЫ
        <span>✦</span>
      </div>

      <div class="timer">
        2 д. 12 ч. до конца
      </div>

      <div class="leader">
        <span>1.</span>
        <b>Player1</b>
        <strong>15 300</strong>
        <i>✦</i>
      </div>

      <div class="leader">
        <span>2.</span>
        <b>Player2</b>
        <strong>12 500</strong>
        <i>✦</i>
      </div>

      <div class="leader">
        <span>3.</span>
        <b>Player3</b>
        <strong>10 200</strong>
        <i>✦</i>
      </div>

      <button class="gold-small-btn" id="tournamentBtn">
        УЧАСТВОВАТЬ
      </button>

    </div>


    <!-- DAILY BONUS -->

    <div class="gold-panel bonus">

      <div class="panel-title">
        ЕЖЕДНЕВНЫЙ БОНУС
      </div>

      <div class="bonus-content">

        <div class="trophies">
          🏆
        </div>

        <div class="gift">
          <div class="gift-top"></div>
          <div class="gift-body"></div>
          <div class="gift-ribbon"></div>
        </div>

        <div class="coins-pile">
          ● ● ●
        </div>

      </div>

      <button class="gold-small-btn" id="bonusBtn">
        ЗАБРАТЬ
      </button>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div class="footer-logo">
      ◆ GOLDEN SPIN
    </div>

    <button id="soundBtn" class="sound-btn">
      🔊
    </button>

  </footer>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<!-- RESULT MODAL -->

<div class="modal" id="resultModal">

  <div class="modal-box">

    <div class="modal-sparkles">✦ ✧ ✦</div>

    <small>GOLDEN SPIN</small>

    <h2 id="resultTitle">
      ВЫИГРЫШ!
    </h2>

    <div class="result-value" id="resultValue">
      +250
    </div>

    <p id="resultText">
      Поздравляем!
    </p>

    <button class="gold-big-btn" id="closeModal">
      ПРОДОЛЖИТЬ
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
